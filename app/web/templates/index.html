{% extends "base.html" %}
{% block titulo %}Simulador · Reforma Tributária{% endblock %}

{% block conteudo %}

{% if erro %}
  <div class="erro">{{ erro }}</div>
{% endif %}

<section class="cartao">
  <h2>Nova simulação</h2>
  <form method="post" action="/simular">
    <div class="grade-2">
      <div class="campo">
        <label for="empresa_id">Empresa</label>
        <select id="empresa_id" name="empresa_id" required {% if not empresas %}disabled{% endif %}>
          <option value="" disabled {% if not selecionado.get('empresa_id') %}selected{% endif %}>Selecione…</option>
          {% for e in empresas %}
            <option value="{{ e.id }}" {% if selecionado.get('empresa_id')|string == e.id|string %}selected{% endif %}>
              {{ e.razao_social }} · {{ e.regime.value }}{% if e.simples_anexo %} (anexo {{ e.simples_anexo }}){% endif %}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="campo">
        <label for="ano_base">Ano da simulação</label>
        <select id="ano_base" name="ano_base" required>
          {% for a in anos %}
            <option value="{{ a }}" {% if selecionado.get('ano_base')|string == a|string %}selected{% endif %}>{{ a }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="campo">
      <label for="cenario_id">Cenário de alíquotas (IBS + CBS)</label>
      <select id="cenario_id" name="cenario_id" {% if not cenarios %}disabled{% endif %}>
        <option value="" disabled {% if not selecionado.get('cenario_id') %}selected{% endif %}>Selecione…</option>
        {% for c in cenarios %}
          <option value="{{ c.id }}" {% if selecionado.get('cenario_id')|string == c.id|string %}selected{% endif %}>
            {{ c.nome }} — IBS {{ c.aliquota_ibs|pctfmt(2) }} + CBS {{ c.aliquota_cbs|pctfmt(2) }} = {{ c.total|pctfmt(2) }}
          </option>
        {% endfor %}
      </select>
      <p class="rodape-meta">Ou, se preferir, digite direto abaixo — não precisa cadastrar um cenário antes.</p>
      <div class="grade-2">
        <div>
          <label for="ibs_personalizado">IBS (%)</label>
          <input type="text" id="ibs_personalizado" name="ibs_personalizado" placeholder="ex.: 8,5"
                 value="{{ selecionado.get('ibs_personalizado', '') }}">
        </div>
        <div>
          <label for="cbs_personalizado">CBS (%)</label>
          <input type="text" id="cbs_personalizado" name="cbs_personalizado" placeholder="ex.: 0,9"
                 value="{{ selecionado.get('cbs_personalizado', '') }}">
        </div>
      </div>
    </div>

    <div class="campo">
      <label>Opção do Simples (apenas se a empresa for optante)</label>
      <div class="radios">
        <label><input type="radio" name="opcao_simples" value="" {% if not selecionado.get('opcao_simples') %}checked{% endif %}> Comparar único e híbrido</label>
        <label><input type="radio" name="opcao_simples" value="unico" {% if selecionado.get('opcao_simples') == 'unico' %}checked{% endif %}> Só único</label>
        <label><input type="radio" name="opcao_simples" value="hibrido" {% if selecionado.get('opcao_simples') == 'hibrido' %}checked{% endif %}> Só híbrido</label>
      </div>
    </div>

    <button type="submit">Simular</button>
  </form>
</section>

{% include "_resultado.html" %}


{% endblock %}
