services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reforma
      POSTGRES_PASSWORD: reforma
      POSTGRES_DB: reforma_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforma"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
