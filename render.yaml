databases:
  - name: reforma-tributaria-db
    plan: free
    databaseName: reforma_tributaria
    user: reforma

services:
  - type: web
    name: reforma-tributaria
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # preDeployCommand não existe no plano free do Render — migration e seed
    # entram no startCommand em vez disso. Sem problema rodar em toda
    # subida do serviço (inclusive ao acordar do sono): os dois são
    # idempotentes, não duplicam nem sobrescrevem nada já existente.
    startCommand: "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: reforma-tributaria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AMBIENTE
        value: prod
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
